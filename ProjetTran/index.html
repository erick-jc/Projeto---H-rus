<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hórus</title>
<style>
:root{--b:#07151d;--c:#0c2029;--l:#265261;--t:#ecf7f6;--m:#a4bdbc;--g:#67d69d;--r:#ff8b8b;--y:#f6c65b}*{box-sizing:border-box}body{margin:0;color:var(--t);font:15px system-ui;background-color:var(--b);background-image:linear-gradient(30deg,transparent 48%,#020b11 49%,#020b11 51%,transparent 52%),linear-gradient(-30deg,transparent 48%,#020b11 49%,#020b11 51%,transparent 52%),linear-gradient(0deg,transparent 96%,#020b11 97%);background-size:76px 44px}main{max-width:1080px;margin:auto;padding:28px 18px}.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.label{font-size:11px;color:var(--m);text-transform:uppercase}.hide{display:none}.ok{color:var(--g)}.bad{color:var(--r)}.pending{color:var(--y)}button,input{padding:10px;border-radius:8px;border:1px solid var(--l);background:#143641;color:var(--t)}button{cursor:pointer;font-weight:700}button:disabled{opacity:.7;cursor:wait}input{width:100%;background:#07151d;margin:6px 0}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button.active{background:var(--g);color:#062129}.notice{margin:12px 0 0;white-space:pre-wrap;color:var(--m)}#ancoragemResult{max-height:145px;overflow-y:auto;padding-right:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:var(--m)}.dot.ok{background:var(--g)}.dot.bad{background:var(--r)}.dot.pending{background:var(--y)}.anchor,.history-item{padding:12px 0;border-bottom:1px solid var(--l)}.anchor:last-child,.history-item:last-child{border:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.verify{margin-left:auto;font-size:19px;font-weight:bold}.sub{color:var(--m);font-size:13px;margin:5px 0 0}.address{overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:13px}.balance{margin:12px 0;padding:15px;border:1px solid var(--g);border-radius:10px;background:#0a2a2c;font-size:20px;font-weight:bold}.alert{border-left:3px solid var(--r);padding-left:10px}a{color:var(--g)}@media(max-width:700px){.grid{grid-template-columns:1fr}.verify{margin-left:0}}
</style><body><main><header><h1>Hórus</h1><p class="label">Painel local de integridade, contrato e auditoria</p></header>
<section class="card"><div id="loginForm"><div class="label">Entrar com mnemonic de teste</div><input id="mnemonic" type="password" autocomplete="off" placeholder="Mnemonic da carteira"><button id="login">Entrar</button></div><div id="walletSession" class="hide"><div class="label">Carteira conectada</div><p id="sessao"></p><button id="showAddress">Mostrar endereço</button><p id="walletAddress" class="address hide"></p><div id="saldo" class="balance"></div><button id="logout">Sair da carteira</button></div><p id="loginResult" class="notice"></p></section>
<nav class="tabs"><button class="active" data-tab="visao">Visão</button><button data-tab="receptor">Receptor e permissões</button><button data-tab="historico">Histórico</button></nav>
<section id="visao"><div class="grid"><div class="card"><div class="label">Contrato</div><b><span id="contractDot" class="dot"></span><span id="contrato">—</span></b><p id="contratoMsg" class="sub"></p></div><div class="card"><div class="label">Robô</div><b><span id="robotDot" class="dot"></span><span id="robo">—</span></b><p id="rede" class="sub"></p></div><div class="card"><div class="label">Lotes ancorados</div><b id="lotes">—</b></div></div><div class="card"><div class="label">Ancoragem e auditoria</div><p><span id="scanDot" class="dot"></span><span id="scanStatus">Pronto para escanear</span></p><button id="scan">Executar scan manual</button><p id="ancoragemResult" class="notice"></p><div class="label">Últimas ancoragens</div><div id="anchors"></div></div></section>
<section id="receptor" class="hide"><div class="card"><div class="label">Receptor atual</div><p id="receiver" class="address">—</p><p id="proposal" class="sub"></p><input id="newReceiver" placeholder="Novo endereço receptor"><button data-action="propor_receptor">Propor troca (dispositivo)</button><button data-action="aprovar_receptor">Aprovar troca (chefe)</button><p id="receptorResult" class="notice"></p></div><div class="card"><div class="label">Carteiras autorizadas para envio</div><ul id="devices"></ul><input id="deviceAddress" placeholder="Endereço para autorizar ou revogar"><button data-action="autorizar">Autorizar (chefe)</button><button data-action="revogar">Revogar (chefe)</button><p id="permissaoResult" class="notice"></p></div></section>
<section id="historico" class="hide"><div class="card"><div class="row"><div class="label">Ações e alertas</div><button id="alertsOnly">Exibir apenas os Alertas</button></div><div id="history"></div></div></section></main>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let mnemonic='',rede='Preview',somenteAlertas=false,itensHistorico=[];
function tab(n){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));['visao','receptor','historico'].forEach(x=>$(x).classList.toggle('hide',x!==n))}function msg(id,t,err=false){const e=$(id);e.textContent=t||'';e.className='notice '+(err?'bad':'ok')}function dot(id,s){$(id).className='dot '+(s==='integro'||s==='ok'?'ok':s==='alerta'||s==='bad'?'bad':s==='pendente'?'pending':'')}function dt(x){const d=new Date(x);return Number.isNaN(d)?'Data indisponível':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'medium'})}function cardano(tx){return `${rede==='Mainnet'?'https://cardanoscan.io':rede==='Preprod'?'https://preprod.cardanoscan.io':'https://preview.cardanoscan.io'}/transaction/${tx}`}async function json(r){const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível concluir a operação.');return d}
function sessao(d){$('loginForm').classList.add('hide');$('walletSession').classList.remove('hide');$('sessao').textContent='Usuário: '+d.papel;$('walletAddress').textContent=d.endereco;$('saldo').textContent='Saldo disponível: '+Number(d.saldoAda||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:6})+' ADA'}function sair(){mnemonic='';$('walletSession').classList.add('hide');$('loginForm').classList.remove('hide');$('walletAddress').classList.add('hide');$('showAddress').textContent='Mostrar endereço'}
function anchors(xs){$('anchors').innerHTML=xs.length?xs.map(x=>{const a=x.auditoria||{},s=a.estado||'pendente',mark=s==='integro'?'✓':s==='alerta'?'✕':'•';return `<article class="anchor"><div class="row"><b>${esc(x.quantidade_logs)} logs</b><span class="sub">${dt(x.ancorado_em)}</span><span class="verify ${s}" title="${esc(a.mensagem||s)}">${mark}</span></div><p class="sub address">Hash: ${esc(x.txHash)} · <a href="${esc(cardano(x.txHash))}" target="_blank" rel="noopener">Ver no Cardanoscan ↗</a></p></article>`}).join(''):'<p class="sub">Sem ancoragens.</p>'}
function history(){const xs=somenteAlertas?itensHistorico.filter(x=>x.alerta):itensHistorico;$('history').innerHTML=xs.length?xs.map(x=>`<article class="history-item ${x.alerta?'alert':''}"><b>${esc(x.label)}</b><p class="sub">${dt(x.em)}</p><p class="address">${esc(x.endereco||x.por||'Carteira não informada')}</p>${x.txHash?`<a class="sub" href="${esc(cardano(x.txHash))}" target="_blank" rel="noopener">Ver prova no Cardanoscan ↗</a>`:''}</article>`).join(''):'<p class="sub">Nenhum alerta encontrado.</p>';$('alertsOnly').textContent=somenteAlertas?'Exibir todo o Histórico':'Exibir apenas os Alertas'}
async function load(){try{const d=await json(await fetch('/api/status')),r=d.registro||{};rede=d.rede||rede;$('contrato').textContent=d.contrato?.estado||'—';$('contratoMsg').textContent=d.contrato?.mensagem||'';$('robo').textContent=d.roboAtivo?'Ativo':'Parado';dot('robotDot',d.roboAtivo?'ok':'bad');$('rede').textContent=rede;$('lotes').textContent=d.totalLotes;$('receiver').textContent=r.receiver||'—';$('proposal').textContent=r.proposed?'Proposta pendente: '+r.proposed:'Sem troca pendente.';$('devices').innerHTML=(r.devices||[]).map(x=>'<li class="address">'+esc(x)+'</li>').join('')||'<li>Nenhuma</li>';anchors(d.ultimos||[]);const alertas=[...(d.ultimos||[]).filter(x=>x.auditoria?.estado==='alerta').map(x=>({label:'ALERTA: integridade da ancoragem',em:x.ancorado_em,endereco:x.txHash,txHash:x.txHash,alerta:true})),...(d.solicitacoes||[]).filter(x=>x.status==='Negada por integridade').map(x=>({label:'ALERTA: mudança de receptor bloqueada',em:x.data,endereco:x.novoEndereco,txHash:x.txHash,alerta:true}))];itensHistorico=[...(d.historicoContrato||[]),...alertas];history()}catch(e){msg('ancoragemResult','Não foi possível atualizar: '+e.message,true)}}
async function login(){try{const m=$('mnemonic').value.trim();if(!m)throw Error('Informe o mnemonic.');const d=await json(await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mnemonic:m})}));mnemonic=m;$('mnemonic').value='';sessao(d);msg('loginResult','')}catch(e){msg('loginResult',e.message,true)}}async function action(a){const area=a.includes('receptor')?'receptorResult':'permissaoResult';if(!mnemonic)return msg(area,'Entre com o mnemonic primeiro.',true);const endereco=a.includes('receptor')?$('newReceiver').value.trim():$('deviceAddress').value.trim();try{const d=await json(await fetch('/api/registro/acao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:a,mnemonic,endereco})}));msg(area,'Transação enviada: '+d.txHash);load()}catch(e){msg(area,e.message,true)}}
$('login').onclick=login;$('logout').onclick=sair;$('showAddress').onclick=()=>{$('walletAddress').classList.toggle('hide');$('showAddress').textContent=$('walletAddress').classList.contains('hide')?'Mostrar endereço':'Ocultar endereço'};$('alertsOnly').onclick=()=>{somenteAlertas=!somenteAlertas;history()};$('scan').onclick=async()=>{const b=$('scan');b.disabled=true;dot('scanDot','pendente');$('scanStatus').textContent='Escaneando…';try{const d=await json(await fetch('/api/auditar',{method:'POST'}));dot('scanDot',d.ok?'ok':'bad');$('scanStatus').textContent=d.ok?'Concluído':'Concluído com alertas';msg('ancoragemResult',d.saida,!d.ok);load()}catch(e){dot('scanDot','bad');$('scanStatus').textContent='Falha no scan';msg('ancoragemResult',e.message,true)}finally{b.disabled=false}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));load();setInterval(load,30000);
</script><script>
/* Ajustes de apresentação: scan compacto, alertas e privacidade da sessão. */
const estiloExtra=document.createElement('style');
estiloExtra.textContent='#sessao{font-size:20px;font-weight:bold}.pending-card{border-color:var(--y)!important;box-shadow:0 0 0 1px var(--y)}#scanSummary{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;font-weight:bold}#ancoragemResult{max-height:145px;overflow-y:auto;padding-right:8px}';document.head.append(estiloExtra);
const cardReceptor=$('receiver').closest('.card');
const botaoAlertas=$('alertsOnly');const areaScan=$('scan').parentElement;areaScan.insertBefore(botaoAlertas,$('ancoragemResult'));botaoAlertas.textContent='Exibir apenas os Alertas';
const resumo=document.createElement('div');resumo.id='scanSummary';areaScan.insertBefore(resumo,$('ancoragemResult'));
let textoScan='',somenteAlertasScan=false;function mostrarScan(texto){textoScan=texto||'';const linhas=textoScan.split('\n');const nIntegro=linhas.filter(x=>/INTEGRO|\u00cdNTEGRO/.test(x)).length,nAlerta=linhas.filter(x=>/ALERTA/.test(x)).length,nPendente=linhas.filter(x=>/PENDENTE/.test(x)).length;resumo.innerHTML=`<span class="ok">▲ Íntegros: ${nIntegro}</span><span class="bad">▲ Alertas: ${nAlerta}</span><span class="pending">▲ Pendentes: ${nPendente}</span>`;$('ancoragemResult').textContent=somenteAlertasScan?linhas.filter(x=>/ALERTA/.test(x)).join('\n')||'Nenhum alerta neste scan.':textoScan}
botaoAlertas.onclick=()=>{somenteAlertasScan=!somenteAlertasScan;botaoAlertas.textContent=somenteAlertasScan?'Exibir resultado completo':'Exibir apenas os Alertas';mostrarScan(textoScan)};
const scanAnterior=$('scan').onclick;$('scan').onclick=async()=>{const b=$('scan');b.disabled=true;dot('scanDot','pendente');$('scanStatus').textContent='Escaneando…';try{const d=await json(await fetch('/api/auditar',{method:'POST'}));dot('scanDot',d.ok?'ok':'bad');$('scanStatus').textContent=d.ok?'Concluído':'Concluído com alertas';mostrarScan(d.saida);load()}catch(e){dot('scanDot','bad');$('scanStatus').textContent='Falha no scan';mostrarScan(e.message)}finally{b.disabled=false}};
const carregarAnterior=load;load=async()=>{await carregarAnterior();const proposta=$('proposal').textContent.includes('Proposta pendente');cardReceptor.classList.toggle('pending-card',proposta);const contratoAtivo=$('contrato').textContent.trim()==='inicializado';$('contrato').textContent=contratoAtivo?'Ativo':'Desativado';dot('contractDot',contratoAtivo?'ok':'bad')};
document.querySelector('#robo').closest('.card').querySelector('.label').textContent='Hórus';
document.querySelector('#anchors').previousElementSibling.textContent='Ancoragens';
estiloExtra.textContent+='#anchors{max-height:360px;overflow-y:auto;padding-right:8px;margin-top:8px}.verify.ok{color:var(--g)}.verify.pending{color:var(--y)}.verify.bad{color:var(--r)}.root-toggle{font-size:11px;padding:3px 7px;margin-left:5px}.local-root{display:block;margin-top:6px;overflow-wrap:anywhere;color:var(--t);font-size:11px}';
anchors=function(xs){$('anchors').innerHTML=xs.length?xs.map(x=>{const a=x.auditoria||{},s=a.estado||'pendente',classe=s==='integro'?'ok':s==='alerta'?'bad':'pending',marca=s==='integro'?'✓':s==='alerta'?'✕':'●',botao=a.merkle_local?` <button class="root-toggle" data-merkle-local="${esc(a.merkle_local)}">Merkle local</button><code class="local-root hide"></code>`:'';return `<article class="anchor"><div class="row"><b>${esc(x.quantidade_logs)} logs</b><span class="sub">${dt(x.ancorado_em)}</span><span class="verify ${classe}" title="${esc(a.mensagem||s)}">${marca}</span></div><p class="sub">${esc(a.mensagem||'')} ${botao}</p><p class="sub address">Hash: ${esc(x.txHash)} · <a href="${esc(cardano(x.txHash))}" target="_blank" rel="noopener">Ver no Cardanoscan ↗</a></p></article>`}).join(''):'<p class="sub">Sem ancoragens.</p>'};
$('anchors').onclick=e=>{const botao=e.target.closest('.root-toggle');if(!botao)return;const raiz=botao.nextElementSibling;raiz.textContent=botao.dataset.merkleLocal;raiz.classList.toggle('hide');botao.textContent=raiz.classList.contains('hide')?'Merkle local':'Ocultar Merkle'};
</script></body></html>
